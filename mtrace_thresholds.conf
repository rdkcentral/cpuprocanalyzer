# Per-process memory threshold configuration for MemoryIncreaseDetection
# Format: ProcessName ThresholdMB Enabled
# 
# ProcessName: exact process name from /proc/PID/comm
# ThresholdMB: threshold in megabytes (converted to KB internally)
# Enabled: yes/no or 1/0
#
# Examples:
# CcspLMLite              5                 yes    # 5 MB threshold, monitoring enabled
# OneWiFi                 10                yes    # 10 MB threshold
# systemd                 2                 no     # Monitoring disabled
# *                       2                 yes    # Default for all unlisted processes

# RDK-B CCSP Processes
CcspLMLite              5                 yes
OneWiFi                 10                yes
CcspTr069Pa             3                 yes
CcspWifiAgent           8                 yes
CcspPandM               4                 yes
CcspCr                  3                 yes

# Libraries (monitoring disabled by default)
librtMessage.so.0       3                 no
libc.so.6               2                 no

# System processes (monitoring disabled)
systemd                 2                 no
dbus-daemon             2                 no

# Default threshold for all other processes
*                       2                 yes
